# Keybindings for the tests: deliberately not the defaults, so tests never depend on
# them. Must bind every action (checked by the `keymap` fixture).
cursor_down: n
cursor_up: p
edit_block_start: s
edit_block_end: d
to_view_mode: ctrl+g
split_block: ctrl+b
insert_newline: ctrl+l
new_block_below: v
new_block_above: b
delete_block: z
indent_block: "]"
outdent_block: "["
undo: h
redo: t
help: g
quit: x
